<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#081d3a"/>
  <!-- Subtle grid lines -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)" opacity="0.03"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#14bf96" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Graduation cap icon, centered top, scaled ~7x from 32px base -->
  <g transform="translate(488, 90) scale(7)">
    <path d="M16 7L4 13l12 6 12-6-12-6z" fill="#14bf96"/>
    <path d="M10 15.5v5c0 2 2.686 3.5 6 3.5s6-1.5 6-3.5v-5L16 19l-6-3.5z" fill="#14bf96" opacity="0.85"/>
    <rect x="26" y="13" width="2" height="7" rx="1" fill="#14bf96" opacity="0.6"/>
  </g>
  <!-- Go2Study wordmark -->
  <text x="600" y="370" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">Go2Study</text>
  <!-- Subtitle in teal -->
  <text x="600" y="440" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="#14bf96" text-anchor="middle">Подготовка к НИШ, БИЛ и РФМШ</text>
  <!-- Tagline -->
  <text x="600" y="500" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#6b8aaa" text-anchor="middle">163 ученика поступили · Онлайн по всему Казахстану</text>
  <!-- Bottom domain -->
  <text x="600" y="580" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#3a5a7a" text-anchor="middle">go2study.kz</text>
</svg>
